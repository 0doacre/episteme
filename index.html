    const STORAGE_KEY = "episteme_controversies_v1";
    const NOTES_KEY_PREFIX = "episteme_note_";

    let controversies = loadControversies();
    let currentDisputeId = controversies[0]?.id || "";
    let selectedDomain = "Tous";

    function loadControversies() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn("Erreur chargement localStorage", e);
      }
      return DEFAULT_CONTROVERSIES;
    }

    function saveControversies(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn("Erreur sauvegarde localStorage", e);
      }
    }

    function getDomains() {
      const set = new Set(controversies.map(c => c.domain));
      return ["Tous", ...Array.from(set)];
    }

    function renderFilters() {
      const container = document.getElementById("domainFilters");
      const domains = getDomains();
      container.innerHTML = domains.map(d => {
        const isActive = selectedDomain === d;
        return `
          <button onclick="setDomain('${d}')"
            class="text-[11px] px-2.5 py-1 rounded transition-colors ${
              isActive 
                ? 'bg-neutral-200 text-neutral-900 font-semibold shadow-sm' 
                : 'bg-notion-sidebar border border-notion-border text-notion-muted hover:border-notion-borderLight hover:text-neutral-200'
            }">
            ${d}
          </button>
        `;
      }).join('');
    }

    function setDomain(d) {
      selectedDomain = d;
      renderFilters();
      renderList();
    }

    function renderList() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = controversies.filter(c => {
        const matchesDomain = selectedDomain === "Tous" || c.domain === selectedDomain;
        const matchesQuery = 
          c.title.toLowerCase().includes(query) ||
          c.domain.toLowerCase().includes(query) ||
          c.definition.toLowerCase().includes(query) ||
          c.positions.some(p => p.name.toLowerCase().includes(query) || p.keyFigures.some(f => f.toLowerCase().includes(query)));
        return matchesDomain && matchesQuery;
      });

      document.getElementById("countDisputes").innerText = filtered.length;
      const listEl = document.getElementById("disputeList");

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-notion-subtle p-3 italic text-center">Aucune controverse trouvée.</div>`;
        return;
      }

      // Si la sélection actuelle n'est pas dans les résultats filtrés, on sélectionne la 1ère
      if (!filtered.some(c => c.id === currentDisputeId)) {
        currentDisputeId = filtered[0].id;
        renderDetail();
      }

      listEl.innerHTML = filtered.map(c => {
        const isSelected = c.id === currentDisputeId;
        return `
          <button onclick="selectDispute('${c.id}')"
            class="w-full text-left p-2.5 rounded text-xs transition-all border ${
              isSelected 
                ? 'bg-notion-cardHover border-notion-borderLight text-neutral-100 font-medium shadow-sm' 
                : 'bg-transparent border-transparent text-notion-muted hover:text-neutral-200 hover:bg-notion-sidebar/60'
            }">
            <div class="text-[10px] text-notion-subtle uppercase tracking-wider mb-0.5 truncate">${c.domain}</div>
            <div class="line-clamp-2 leading-snug">${c.title}</div>
          </button>
        `;
      }).join('');
    }

    function selectDispute(id) {
      currentDisputeId = id;
      renderList();
      renderDetail();
    }

    function getLevelBadgeClass(level) {
      switch (level) {
        case 'Facile': return 'badge-facile';
        case 'Moyen': return 'badge-moyen';
        case 'Difficile': return 'badge-difficile';
        case 'Expert': return 'badge-expert';
        default: return 'text-neutral-400 border-neutral-700 bg-neutral-800/40';
      }
    }

    function getReadingUrl(reading) {
      if (reading.link && reading.link !== "#" && reading.link.startsWith("http")) {
        return reading.link;
      }
      // Générer une recherche Google Scholar / web pertinente si pas d'URL directe
      const query = encodeURIComponent(`${reading.title} ${reading.author}`);
      return `https://scholar.google.com/scholar?q=${query}`;
    }

    function renderDetail() {
      const c = controversies.find(item => item.id === currentDisputeId);
      const container = document.getElementById("detailContainer");
      if (!c) {
        container.innerHTML = `<div class="text-xs text-notion-subtle">Sélectionnez une controverse pour afficher les détails.</div>`;
        return;
      }

      // Récupérer la note d'atelier sauvegardée pour cette controverse
      const savedNote = localStorage.getItem(NOTES_KEY_PREFIX + c.id) || "";
      const savedLean = localStorage.getItem(NOTES_KEY_PREFIX + c.id + "_lean") || "1";

      container.innerHTML = `
        <!-- Titre & Domaine -->
        <div class="border-b border-notion-border pb-4 flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-mono text-notion-subtle uppercase tracking-wider">${c.domain}</span>
            <span class="text-[11px] font-mono text-neutral-500">ID: ${c.id}</span>
          </div>
          <h1 class="text-xl md:text-2xl font-bold text-neutral-100 tracking-tight leading-tight">${c.title}</h1>
        </div>

        <!-- Définition de la ligne de fracture -->
        <div class="space-y-1.5">
          <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-notion-muted">
            <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Définition de la ligne de fracture épistémique</span>
          </div>
          <div class="text-sm text-neutral-200 leading-relaxed bg-notion-sidebar p-4 rounded-md border border-notion-border font-normal">
            ${c.definition}
          </div>
        </div>

        <!-- Garde-fou épistémique (Anti-Faux Équilibre) -->
        <div class="p-4 rounded-md border border-neutral-800 bg-neutral-900/80 flex items-start gap-3 shadow-inner">
          <div class="w-5 h-5 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center shrink-0 text-neutral-400 text-xs font-mono font-bold mt-0.5">§</div>
          <div class="space-y-1">
            <div class="text-[11px] font-semibold tracking-wider uppercase text-neutral-300">
              Garde-fou méthodologique & Anti-faux équilibre
            </div>
            <p class="text-xs text-notion-muted leading-relaxed font-light">
              ${c.guardrail}
            </p>
          </div>
        </div>

        <!-- Les deux pôles rationnels de la controverse -->
        <div class="space-y-2.5">
          <div class="text-xs font-semibold uppercase tracking-wider text-notion-muted">
            Positions rationnelles en présence
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${c.positions.map((pos, idx) => `
              <div class="bg-notion-sidebar border border-notion-border hover:border-notion-borderLight rounded-md p-4 flex flex-col justify-between transition-colors">
                <div class="space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-mono font-semibold text-neutral-400 bg-neutral-800/80 px-2 py-0.5 rounded border border-neutral-700">
                      THÈSE 0${idx + 1}
                    </span>
                  </div>
                  <h3 class="text-sm font-semibold text-neutral-200 leading-snug">${pos.name}</h3>
                  <p class="text-xs text-notion-muted leading-relaxed font-normal">${pos.summary}</p>
                </div>
                <div class="mt-4 pt-3 border-t border-notion-border/60 text-[11px] text-notion-subtle">
                  Auteurs repères : <span class="text-neutral-300 font-medium">${pos.keyFigures.join(', ')}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Progression de lecture graduée (4 paliers) -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="text-xs font-semibold uppercase tracking-wider text-notion-muted">Corpus documentaire graduel</div>
            <span class="text-[11px] text-notion-subtle font-mono">4 paliers d'exigence épistémique</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            ${c.readings.map(r => {
              const url = getReadingUrl(r);
              return `
                <div class="border border-notion-border bg-notion-sidebar hover:border-notion-borderLight rounded-md p-3.5 flex flex-col justify-between gap-3 transition-colors">
                  <div class="space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="inline-block text-[10px] font-mono font-medium border px-1.5 py-0.5 rounded ${getLevelBadgeClass(r.level)}">
                        ${r.level}
                      </span>
                      <span class="text-[10px] text-neutral-500 font-mono italic truncate max-w-[110px]">${r.type}</span>
                    </div>
                    <a href="${url}" target="_blank" rel="noopener noreferrer" 
                       class="group inline-flex items-start gap-1 text-xs font-medium text-neutral-200 hover:text-white leading-snug">
                      <span class="line-clamp-2 underline decoration-neutral-700 underline-offset-2 group-hover:decoration-neutral-400">${r.title}</span>
                      <svg class="w-3 h-3 shrink-0 opacity-60 group-hover:opacity-100 transition-opacity mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                    <div class="text-[11px] text-notion-subtle font-medium">${r.author}</div>
                  </div>
                  <p class="text-[11px] text-notion-muted leading-relaxed border-t border-notion-border/50 pt-2.5 font-light">
                    ${r.note}
                  </p>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Atelier interactif de décentration (Protocole de Johnson & Johnson) -->
        <div class="border-t border-notion-border pt-5 flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-semibold text-neutral-300 uppercase tracking-wider">Atelier de Décentration</span>
              <span class="text-[10px] font-mono text-neutral-500 border border-neutral-800 rounded px-1.5 py-0.5">Johnson & Johnson</span>
            </div>
            <span class="text-[11px] text-notion-subtle">Principe de charité épistémique</span>
          </div>

          <div class="bg-neutral-900/90 border border-notion-borderLight rounded-md p-4 space-y-3">
            <div class="text-xs text-neutral-300">
              <span class="font-medium text-neutral-200">1. Mon intuition spontanée penche vers :</span>
              <div class="mt-2 flex flex-wrap gap-2 text-xs">
                <label class="cursor-pointer flex items-center gap-2 px-2.5 py-1.5 rounded border ${savedLean === '1' ? 'border-neutral-400 bg-neutral-800 text-white' : 'border-notion-border bg-notion-sidebar text-notion-muted'} transition-colors">
                  <input type="radio" name="lean" value="1" ${savedLean === '1' ? 'checked' : ''} onchange="updateLean('1')" class="hidden">
                  <span>Thèse 01 : ${c.positions[0]?.name.slice(0, 36)}...</span>
                </label>
                <label class="cursor-pointer flex items-center gap-2 px-2.5 py-1.5 rounded border ${savedLean === '2' ? 'border-neutral-400 bg-neutral-800 text-white' : 'border-notion-border bg-notion-sidebar text-notion-muted'} transition-colors">
                  <input type="radio" name="lean" value="2" ${savedLean === '2' ? 'checked' : ''} onchange="updateLean('2')" class="hidden">
                  <span>Thèse 02 : ${c.positions[1]?.name.slice(0, 36)}...</span>
                </label>
              </div>
            </div>

            <div class="space-y-1.5 pt-1">
              <label for="decentrationNote" class="block text-xs text-neutral-300 font-medium">
                2. Exercice du Steelman — Défendez en quelques lignes la position 
                <strong class="text-neutral-100">${savedLean === '1' ? 'adverse (Thèse 02)' : 'adverse (Thèse 01)'}</strong> :
              </label>
              <textarea id="decentrationNote" rows="3" 
                placeholder="Exposez les prémisses et les arguments les plus solides de la position opposée, sans caricature..."
                oninput="saveNote(this.value)"
                class="w-full bg-notion-sidebar border border-notion-border rounded p-3 text-xs text-neutral-100 placeholder-notion-subtle focus:outline-none focus:border-neutral-400 transition-colors leading-relaxed font-sans">${savedNote}</textarea>
            </div>

            <div class="flex items-center justify-between text-[11px] text-notion-subtle pt-1">
              <span id="charCount">${savedNote.length} caractères</span>
              <div class="flex items-center gap-2">
                <button onclick="clearCurrentNote()" class="hover:text-neutral-300 transition-colors">Effacer</button>
                <button onclick="copyCurrentNote()" class="px-2.5 py-1 rounded border border-neutral-700 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 transition-colors">
                  Copier l'argument
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Gestion de l'atelier de décentration
    function updateLean(value) {
      localStorage.setItem(NOTES_KEY_PREFIX + currentDisputeId + "_lean", value);
      renderDetail();
    }

    function saveNote(value) {
      localStorage.setItem(NOTES_KEY_PREFIX + currentDisputeId, value);
      const countEl = document.getElementById("charCount");
      if (countEl) countEl.innerText = `${value.length} caractères`;
    }

    function clearCurrentNote() {
      const textarea = document.getElementById("decentrationNote");
      if (textarea) {
        textarea.value = "";
        saveNote("");
      }
    }

    function copyCurrentNote() {
      const note = localStorage.getItem(NOTES_KEY_PREFIX + currentDisputeId) || "";
      if (!note.trim()) {
        showToast("Rédigez d'abord votre argument !", "ℹ️");
        return;
      }
      navigator.clipboard.writeText(note).then(() => {
        showToast("Argument copié dans le presse-papiers !", "✓");
      }).catch(() => {
        showToast("Erreur lors de la copie", "⚠️");
      });
    }

    // Gestion de l'import JSON
    document.getElementById('jsonUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported) && imported.length > 0 && imported[0].id && imported[0].title) {
            controversies = imported;
            saveControversies(controversies);
            currentDisputeId = controversies[0].id;
            selectedDomain = "Tous";
            renderFilters();
            renderList();
            renderDetail();
            showToast(`${imported.length} controverses importées avec succès !`, "✓");
          } else {
            alert("Erreur de format : Le fichier JSON doit être un tableau d'objets respectant le schéma Épistémê (champs obligatoires: id, domain, title, definition, positions, readings).");
          }
        } catch (err) {
          alert("Erreur de lecture du JSON : " + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // Gestion de l'export JSON
    function exportCorpus() {
      const jsonStr = JSON.stringify(controversies, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `episteme_corpus_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Corpus téléchargé !", "⬇️");
    }

    // Réinitialisation au corpus par défaut
    function resetDefaultCorpus() {
      if (confirm("Réinitialiser le corpus aux controverses didactiques initiales ?")) {
        controversies = DEFAULT_CONTROVERSIES;
        saveControversies(controversies);
        currentDisputeId = controversies[0].id;
        selectedDomain = "Tous";
        renderFilters();
        renderList();
        renderDetail();
        showToast("Corpus réinitialisé par défaut", "↺");
      }
    }

    // Système de notification Toast
    function showToast(message, icon = "✓") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toastMessage");
      const iconEl = document.getElementById("toastIcon");
      if (!toast || !msgEl || !iconEl) return;

      msgEl.innerText = message;
      iconEl.innerText = icon;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");

      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 3000);
    }

    // Initialisation au chargement
    document.getElementById("searchInput").addEventListener("input", renderList);
    renderFilters();
    renderList();
    renderDetail();
  </script>
</body>
</html>
